name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint (typecheck + biome)
        run: npm run lint

      - name: Build
        run: npm run build

      # selector.md は各コンポーネントの md から生成する。md を直して生成し忘れた場合に検知する
      - name: Check guidelines are up to date
        run: git diff --exit-code -- guidelines/selector.md
