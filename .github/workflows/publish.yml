# Publishes to npm on `v*` tag push.
#
# Release flow:
#   1. Bump version: `npm version <patch|minor|major>`
#      (this commits and creates the tag locally)
#   2. Push the tag: `git push --follow-tags`
#   3. This workflow picks up the tag, builds, and runs `npm publish`
#      with provenance enabled (OIDC-signed attestation).
#
# Required repository secret:
#   NPM_TOKEN — automation token for the npm account that owns `wip-ui`
#               (see Settings -> Secrets and variables -> Actions).

name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # id-token: write is required for npm provenance attestation
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
